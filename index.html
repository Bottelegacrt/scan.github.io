<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Day Forensic Shield</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09090b',
                        panelBg: '#18181b',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #09090b; color: #e4e4e7; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(12px); border: 1px solid #27272a; }
        .file-input-wrapper:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <div class="w-full max-w-6xl mb-8 text-center mt-6">
        <h1 class="text-4xl font-bold tracking-tight text-white mb-2">PCA <span class="text-blue-500">Forensic</span> Analyzer</h1>
        <p class="text-gray-400">Client-side inspection. Zero data leaves your browser. Designed for GitHub Pages.</p>
    </div>

    <!-- Панель загрузки -->
    <div class="w-full max-w-6xl glass-panel rounded-2xl p-8 mb-8 shadow-2xl">
        <form id="uploadForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="file-input-wrapper border-2 border-dashed border-gray-700 rounded-xl p-6 text-center transition-all cursor-pointer relative">
                <input type="file" id="pca_gen" accept=".txt" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <svg class="w-10 h-10 mx-auto text-gray-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-sm font-semibold text-gray-300" id="gen_label">Upload PcaGeneralDb0.txt</p>
                <p class="text-xs text-gray-500 mt-1">Optional</p>
            </div>

            <div class="file-input-wrapper border-2 border-dashed border-gray-700 rounded-xl p-6 text-center transition-all cursor-pointer relative">
                <input type="file" id="pca_dic" accept=".txt" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <svg class="w-10 h-10 mx-auto text-gray-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <p class="text-sm font-semibold text-gray-300" id="dic_label">Upload PcaAppLaunchDic.txt</p>
                <p class="text-xs text-gray-500 mt-1">Optional</p>
            </div>

            <div class="col-span-1 md:col-span-2 flex justify-end items-center mt-2">
                <div class="flex items-center space-x-4 text-sm text-gray-400 mr-auto">
                    <span class="flex items-center"><div class="w-3 h-3 bg-red-500 rounded-full mr-2 shadow-[0_0_8px_#ef4444]"></div> Cheats Detected</span>
                    <span class="flex items-center"><div class="w-3 h-3 bg-amber-500 rounded-full mr-2 shadow-[0_0_8px_#f59e0b]"></div> High Entropy</span>
                    <span class="flex items-center"><div class="w-3 h-3 bg-zinc-600 border border-red-500 rounded-full mr-2"></div> &lt; 90 Days</span>
                </div>
                <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-[0_0_15px_rgba(37,99,235,0.4)] cursor-pointer z-10 relative">
                    Analyze Vectors
                </button>
            </div>
        </form>
    </div>

    <!-- Таблица результатов -->
    <div id="resultsPanel" class="w-full max-w-6xl glass-panel rounded-2xl overflow-hidden hidden shadow-2xl">
        <div class="overflow-x-auto custom-scrollbar max-h-[600px]">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-0 bg-[#1f1f22] z-10">
                    <tr class="border-b border-gray-800 text-xs uppercase tracking-wider text-gray-400">
                        <th class="p-4 font-semibold w-32">Date</th>
                        <th class="p-4 font-semibold w-1/4">Filename</th>
                        <th class="p-4 font-semibold">Full Path</th>
                        <th class="p-4 font-semibold w-48 text-right">Flags</th>
                    </tr>
                </thead>
                <tbody id="resultsBody" class="text-sm divide-y divide-gray-800">
                    <!-- Записи будут добавлены сюда через JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- База читов ---
        const CHEAT_KEYWORDS = [
            "exloader", "com.swiftsoft", "xone", "interium", "skinchanger", "extrimhack", "nix", "memesense", 
            "mvploader", "sharkhack", "exhack", "neverkernel", "vredux", "mason", "predator", "aquila", "luno", 
            "fecurity", "cartel", "aimstar", "tkazer", "naim", "pellix", "pussycat", "axios", "onemacro", "softhub", 
            "proext", "sapphire", "interwebz", "plague", "vapehook", "smurfwrecker", "iniuria", "yeahnot", "legendware", 
            "hauntedproject", "phoenixhack", "onebyteradar", "reborn", "onebyte", "osiris", "ev0lve", "ghostware", 
            "dexterion", "basicmultihack", "pudra", "icheat", "sneakys", "krazyhack", "muhprime", "drcheats", "rootcheat", 
            "aeonix", "zedt.pw", "devcore", "legifard", "katebot", "imxnoobx", "w1nner", "ekknod", "neoxahack", "warware", 
            "weave", "aimmy", "paradise", "xenon", "easysp", "en1gma", "injector", ".ahk", "macros", "bhop", "bunnyhop", 
            "espd2x", "avira", "pphud", "primordial", "nonagon", "legit", "hvh", "aimbot", "s1mple", "semirage", "cheat", 
            "cs2.glow", "invision", "undetek", "spurdo", "webradar", "valthrun"
        ];

        // Обновление интерфейса при выборе файлов
        document.getElementById('pca_gen').addEventListener('change', e => {
            const f = e.target.files[0];
            const label = document.getElementById('gen_label');
            label.innerText = f ? f.name : 'Upload PcaGeneralDb0.txt';
            f ? label.classList.add('text-blue-400') : label.classList.remove('text-blue-400');
        });
        document.getElementById('pca_dic').addEventListener('change', e => {
            const f = e.target.files[0];
            const label = document.getElementById('dic_label');
            label.innerText = f ? f.name : 'Upload PcaAppLaunchDic.txt';
            f ? label.classList.add('text-blue-400') : label.classList.remove('text-blue-400');
        });

        // Расчет Энтропии Шеннона (JavaScript версия)
        function calculateEntropy(filename) {
            if (!filename) return 0.0;
            // Убираем расширение (.exe, .dll) для более точного анализа
            const baseName = filename.substring(0, filename.lastIndexOf('.')) || filename;
            if (baseName.length < 5) return 0.0; // Игнорируем короткие имена

            const counts = {};
            for (let i = 0; i < baseName.length; i++) {
                const char = baseName[i];
                counts[char] = (counts[char] || 0) + 1;
            }

            let entropy = 0;
            for (let char in counts) {
                const p = counts[char] / baseName.length;
                entropy -= p * Math.log2(p);
            }
            return entropy;
        }

        // Умное чтение файла с распознаванием кодировки (UTF-16LE для логов Win)
        async function readLogFile(file) {
            const buffer = await file.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            
            // Пытаемся найти UTF-16LE маркеры или нулевые байты
            let isUTF16 = false;
            if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
                isUTF16 = true;
            } else {
                for (let i = 0; i < Math.min(bytes.length, 200); i++) {
                    if (bytes[i] === 0) { isUTF16 = true; break; }
                }
            }

            const decoder = new TextDecoder(isUTF16 ? 'utf-16le' : 'utf-8');
            const text = decoder.decode(buffer);
            return text.split(/\r?\n/).filter(line => line.trim().length > 0);
        }

        // Парсинг одной строки
        function processLine(line, isDic) {
            const limitDate = new Date();
            limitDate.setDate(limitDate.getDate() - 90); // -90 дней
            
            let dateStr = "";
            let filePath = "";
            
            if (isDic) {
                const parts = line.split('|');
                filePath = parts[0].trim();
                const dMatch = line.match(/(\d{4}[-/]\d{2}[-/]\d{2})/);
                if (dMatch) dateStr = dMatch[1].replace(/\//g, '-');
            } else {
                const parts = line.split('|').map(p => p.trim());
                for (let part of parts) {
                    if (!dateStr && /(\d{4}[-/]\d{2}[-/]\d{2})/.test(part)) {
                        dateStr = part.match(/(\d{4}[-/]\d{2}[-/]\d{2})/)[1].replace(/\//g, '-');
                    } else if (!filePath && (part.includes(':\\') || part.includes('/'))) {
                        filePath = part;
                    }
                }
            }

            if (!filePath) return null;

            const name = filePath.split('\\').pop().split('/').pop(); // os.path.basename
            
            let isRecent = false;
            if (dateStr) {
                const rowDate = new Date(dateStr);
                if (rowDate >= limitDate) isRecent = true;
            }

            const lowerPath = filePath.toLowerCase();
            const foundCheats = CHEAT_KEYWORDS.filter(c => lowerPath.includes(c));
            
            const entropyVal = calculateEntropy(name);
            const isSuspicious = entropyVal > 3.8;

            return {
                date: dateStr || "Unknown",
                name: name,
                path: filePath,
                is_recent: isRecent,
                found_cheats: foundCheats,
                is_suspicious: isSuspicious,
                entropy: entropyVal.toFixed(2)
            };
        }

        // Основной обработчик
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Scanning...';
            btn.classList.add('animate-pulse');

            try {
                const genFile = document.getElementById('pca_gen').files[0];
                const dicFile = document.getElementById('pca_dic').files[0];
                
                let allResults = [];

                if (genFile) {
                    const lines = await readLogFile(genFile);
                    lines.forEach(line => {
                        const parsed = processLine(line, false);
                        if (parsed) allResults.push(parsed);
                    });
                }

                if (dicFile) {
                    const lines = await readLogFile(dicFile);
                    lines.forEach(line => {
                        const parsed = processLine(line, true);
                        if (parsed) allResults.push(parsed);
                    });
                }

                if (allResults.length === 0) {
                    alert("No data found or no files selected.");
                    return;
                }

                // Удаляем дубликаты по пути (Full Path)
                const uniqueMap = new Map();
                allResults.forEach(item => uniqueMap.set(item.path, item));
                let uniqueResults = Array.from(uniqueMap.values());

                // Сортировка: Сначала Читы -> Потом Подозрительные -> Потом Свежие (< 90д)
                uniqueResults.sort((a, b) => {
                    if (a.found_cheats.length > 0 && b.found_cheats.length === 0) return -1;
                    if (a.found_cheats.length === 0 && b.found_cheats.length > 0) return 1;
                    
                    if (a.is_suspicious && !b.is_suspicious) return -1;
                    if (!a.is_suspicious && b.is_suspicious) return 1;
                    
                    if (a.is_recent && !b.is_recent) return -1;
                    if (!a.is_recent && b.is_recent) return 1;
                    
                    return 0;
                });

                // Рендер таблицы
                const tbody = document.getElementById('resultsBody');
                tbody.innerHTML = '';

                uniqueResults.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-[#202024] transition-colors';
                    
                    let rowBorder = item.is_recent ? 'border-l-4 border-l-red-500' : 'border-l-4 border-l-transparent';
                    
                    let badges = '';
                    if (item.found_cheats.length > 0) {
                        badges += `<span class="inline-block bg-red-500/20 text-red-400 border border-red-500/50 px-2 py-1 rounded text-xs font-bold mb-1 shadow-[0_0_10px_rgba(239,68,68,0.2)]">CHEAT: ${item.found_cheats[0].toUpperCase()}</span><br>`;
                        tr.classList.add('bg-red-950/20');
                    }
                    if (item.is_suspicious) {
                        badges += `<span class="inline-block bg-amber-500/20 text-amber-400 border border-amber-500/50 px-2 py-1 rounded text-xs font-bold mb-1 shadow-[0_0_10px_rgba(245,158,11,0.2)]">ENTROPY: ${item.entropy}</span>`;
                        if (item.found_cheats.length === 0) tr.classList.add('bg-amber-950/10');
                    }

                    tr.innerHTML = `
                        <td class="p-4 whitespace-nowrap text-gray-400 ${rowBorder}">
                            ${item.date} 
                            ${item.is_recent ? '<span class="text-red-500 ml-1 font-bold text-xl leading-none align-middle" title="< 90 Days">•</span>' : ''}
                        </td>
                        <td class="p-4 font-mono text-gray-200 break-all">${item.name}</td>
                        <td class="p-4 text-gray-500 text-xs break-all">${item.path}</td>
                        <td class="p-4 text-right align-top">${badges}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('resultsPanel').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                alert('Error analyzing files. Make sure they are valid Windows PCA Logs.');
            } finally {
                btn.innerText = 'Analyze Vectors';
                btn.classList.remove('animate-pulse');
            }
        });
    </script>
</body>
</html>
